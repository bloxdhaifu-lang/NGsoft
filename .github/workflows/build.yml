name: build
on: [workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: choco install nsis -y --no-progress
      - run: makensis /V2 build.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: NGsoft1.0
          path: NGsoft1.0.exe
          if-no-files-found: error
